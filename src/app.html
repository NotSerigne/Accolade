<!-- src/app.html -->
<!doctype html>
<html lang="en">
	<head>
		<title>Accolade</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.svg" />
		<script>
			(() => {
				try {
					const raw = localStorage.getItem('accolade:theme:v1');
					if (!raw) return;
					const parsed = JSON.parse(raw);
					const theme = parsed?.theme;
					const accent = typeof parsed?.accentColor === 'string' ? parsed.accentColor : null;
					if (theme !== 'dark' && theme !== 'light' && theme !== 'system') return;
					if (!accent) return;
					const root = document.documentElement;

					const resolvedTheme =
						theme === 'system'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: theme;

					root.setAttribute('data-theme', resolvedTheme);
					const calibrated =
						accent.trim().toLowerCase() !== '#c8a96e' ? parsed?.calibrated?.[resolvedTheme] : null;
					if (calibrated && typeof calibrated.accent === 'string' && calibrated.accent) {
						root.style.setProperty('--accent-default', calibrated.accent);
						root.style.setProperty('--accent', calibrated.accent);
						if (typeof calibrated.text === 'string' && calibrated.text) {
							root.style.setProperty('--accent-text', calibrated.text);
						}
					}
					root.style.colorScheme = resolvedTheme;
				} catch {}
			})();
		</script>
		%sveltekit.head%
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
