[package]
name = "Accolade"
version = "1.0.6"
description = "Accolade is a desktop app that brings achievements back to life in cracked games."
authors = ["NotSerigne"]
license = "MIT"
repository = "https://github.com/NotSerigne/Accolade"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.29"
tauri = { version = "2.10.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2.8.0"
notify = "9.0.0-rc.2"
rust-ini = "0.21"
reqwest = { version = "0.13.2", features = ["json"] }
dotenv = "0.15"
tauri-plugin-store = "2.4.2"
tauri-plugin-shell = "2.2.0"
tauri-plugin-dialog = "2.2.0"
winreg = "0.56.0"
scraper = "0.26.0"
quick-xml = "0.39.2"
futures = "0.3.31"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.2.0"
async-trait = "0.1.89"
genpdf = "0.2.0"
screenshots = "0.8.10"
image = "0.25.5"
windows-capture = "2.0.0"
windows = { version = "0.62.0", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Direct3D11", "Win32_System_WinRT"] }
tauri-plugin-global-shortcut = "2.2.0"
tauri-plugin-opener = "2.5.4"
dunce = "1.0.5"

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link-time optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols
