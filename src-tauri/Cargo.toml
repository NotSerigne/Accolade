[package]
name = "Accolade"
version = "0.1.0"
description = "Accolade is a desktop app that brings achievements back to life in cracked games."
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
log = "0.4.29"
tauri = { version = "2.10.3" }
tauri-plugin-log = "2.8.0"
notify = "9.0.0-rc.2"
rust-ini = "0.21"
reqwest = { version = "0.12", features = ["json"] }

[build]
script = "build.rs"